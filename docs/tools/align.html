<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌词对齐 · 特零128 的歌</title>
<style>
  :root{--bg:#15171a;--fg:#e8e6e2;--muted:#9aa0a6;--line:#2c3034;--card:#1c2024;
    --accent:#f59e0b;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.03em}
  select,input,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px}
  select{max-width:320px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:700}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;max-width:1180px;margin:0 auto;padding:14px 16px 60px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
  audio{width:100%;margin-bottom:10px}
  .now{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
  .now b{color:var(--fg);font-weight:600}
  .big{font-size:19px;line-height:1.4;margin:12px 0 4px;min-height:54px}
  .big .cur{color:var(--accent);font-weight:700}
  .big .next{color:var(--muted);font-size:15px}
  .lyr{max-height:44vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .lyr div{padding:2px 6px;border-radius:6px;font-size:14.5px;color:var(--muted);cursor:pointer}
  .lyr div.on{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .lyr div:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
  .off{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
  .off .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;text-align:center;
    color:var(--accent)}
  .off button{padding:6px 10px;min-width:52px}
  .rng{width:100%}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.7}
  .hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px}
  .list{max-height:calc(100vh - 120px);overflow:auto;font-size:13px}
  .list a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;color:inherit;text-decoration:none}
  .list a:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
  .list a.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:#3a3f45;flex-shrink:0}
  .dot.set{background:var(--ok)}
  .list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .o{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .list a.dis{opacity:.4;cursor:default;pointer-events:none}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
  .tag.offline{color:#f59e0b;border-color:#5a4620}
</style>
</head>
<body>
<header>
  <h1>歌词对齐</h1>
  <select id="song"></select>
  <button id="prev" type="button">← 上一首</button>
  <button id="next" type="button">下一首 →</button>
  <button id="nextTodo" type="button">下一个没对齐的</button>
  <button id="export" class="primary" type="button">导出 offsets.json</button>
  <span class="tag" id="stat"></span>
</header>

<div class="wrap">
  <section class="panel">
    <audio id="au" controls preload="metadata"></audio>
    <div class="now">
      <span>播放到 <b id="t-now">0:00</b></span>
      <span id="t-len">/ 0:00</span>
      <span>当前偏移 <b id="t-off">+0.0s</b></span>
      <span id="sync-tag"></span>
    </div>
    <div class="big" id="big"><span class="cur">—</span></div>
    <div class="off">
      <button data-d="-10" type="button">−10s</button>
      <button data-d="-5" type="button">−5s</button>
      <button data-d="-1" type="button">−1s</button>
      <button data-d="-0.2" type="button">−0.2</button>
      <span class="v" id="offval">+0.0s</span>
      <button data-d="0.2" type="button">+0.2</button>
      <button data-d="1" type="button">+1s</button>
      <button data-d="5" type="button">+5s</button>
      <button data-d="10" type="button">+10s</button>
    </div>
    <input class="rng" id="rng" type="range" min="-60" max="60" step="0.1" value="0">
    <div class="bar">
      <button data-jump="first" type="button">跳到第一句</button>
      <button data-jump="mid" type="button">跳到中间</button>
      <button data-jump="last" type="button">跳到最后一句</button>
      <button data-jump="0" type="button">回到开头</button>
      <button id="zero" type="button">偏移归零</button>
      <button id="loadSite" type="button">载入站点里的偏移</button>
    </div>
    <p class="hint">
      用法：先点「跳到第一句」听一句 —— 高亮的那行是不是正好在唱？<br>
      偏了就用 <b>−/+</b> 调（先大后小：±10s 粗调，±1s 中调，±0.2s 收尾），调完按 <kbd>Enter</kbd> 存下并跳下一首。<br>
      快捷键：<kbd>空格</kbd> 播放/暂停　<kbd>[</kbd> <kbd>]</kbd> 偏移 ∓0.2s　<kbd>{</kbd> <kbd>}</kbd> 偏移 ∓5s　<kbd>←</kbd> <kbd>→</kbd> 前后 3 秒<br>
      换歌会自动保存；关掉页面数据也在，最后点右上角「导出 offsets.json」把文件给我。
    </p>
  </section>

  <aside class="panel list" id="list"></aside>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const au = $('#au');
  const KEY = 'tl128-align';
  let songs = [], cur = null, off = {}, done = new Set();

  const fmt = (t) => {
    if (!isFinite(t) || t < 0) t = 0;
    return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  };

  function loadStore() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || '{}');
      off = d.off || {};
      done = new Set(d.done || []);
    } catch (e) { off = {}; done = new Set(); }
  }
  function saveStore() {
    localStorage.setItem(KEY, JSON.stringify({ off, done: [...done] }));
  }

  function lineAt(t) {
    if (!cur || !cur.y) return -1;
    const arr = cur.y;
    let k = -1;
    for (let i = 0; i < arr.length; i++) { if (arr[i][0] <= t) k = i; else break; }
    return k;
  }

  function paint() {
    const o = off[cur.id] || 0;
    $('#offval').textContent = (o > 0 ? '+' : '') + o.toFixed(1) + 's';
    $('#t-off').textContent = (o > 0 ? '+' : '') + o.toFixed(1) + 's';
    $('#rng').value = o;
    $('#t-now').textContent = fmt(au.currentTime);
    $('#t-len').textContent = '/ ' + (cur.dt || fmt(cur.d));
    $('#sync-tag').innerHTML = cur.y ? '<span class="tag">有时间轴 ' + cur.y.length + ' 行</span>'
      : '<span class="tag offline">没有时间轴</span>';

    const t = au.currentTime + o;
    const k = lineAt(t);
    const nodes = document.querySelectorAll('.lyr div');
    nodes.forEach((n, i) => n.classList.toggle('on', i === k));
    const textOf = (i) => lyrLine(i);
    if (cur.y && k >= 0) {
      const a = textOf(k), b = k + 1 < cur.y.length ? textOf(k + 1) : '';
      $('#big').innerHTML = '<span class="cur">' + esc(a) + '</span>' +
        (b ? '<br><span class="next">' + esc(b) + '</span>' : '');
      const node = nodes[k];
      if (node) {
        const box = node.parentElement;
        const rel = node.offsetTop - box.scrollTop;
        if (rel < 30 || rel > box.clientHeight - 40) box.scrollTop = node.offsetTop - box.clientHeight / 3;
      }
    } else if (cur.y) {
      $('#big').innerHTML = '<span class="next">（还没到第一句）</span>';
    }
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  // 时间轴里的文本可能是「原文 / 译文」合并的，优先用 songs.json 里拆分过的歌词
  function lyrLine(i) {
    if (!cur || !cur.y || !cur.y[i]) return '';
    if (cur.l && cur.l.length === cur.y.length && cur.l[i]) return cur.l[i];
    return cur.y[i][1];
  }
  const CREDIT = /^(作词|作曲|编曲|制作|混音|母带|原唱|词|曲)\s*[:：]/;
  function firstVocalIdx() {
    if (!cur || !cur.y) return 0;
    for (let i = 0; i < cur.y.length; i++) {
      if (!CREDIT.test(lyrLine(i)) && cur.y[i][0] >= 1) return i;
    }
    return 0;
  }

  function renderList() {
    const withY = songs.filter((s) => s.y);
    const without = songs.filter((s) => !s.y);
    $('#list').innerHTML = withY.map((s) => {
      const o = off[s.id];
      return `<a href="#" data-id="${esc(s.id)}" class="${cur && cur.id === s.id ? 'cur' : ''}">
        <span class="dot${o != null ? ' set' : ''}"></span>
        <span class="t">${esc(s.t)}</span>
        <span class="o">${o != null ? (o > 0 ? '+' : '') + o.toFixed(1) : ''}</span>
      </a>`;
    }).join('') + (without.length ? '<p class="hint" style="margin:10px 8px 4px">没有时间轴（只能用打点工具）：</p>'
      + without.map((s) => `<a class="dis" title="没有时间轴"><span class="dot"></span><span class="t">${esc(s.t)}</span></a>`).join('') : '');
    const n = withY.filter((s) => off[s.id] != null).length;
    $('#stat').textContent = `已对齐 ${n} / ${withY.length} 首`;
  }

  function loadSong(id) {
    const s = songs.find((x) => x.id === id);
    if (!s) return;
    cur = s;
    au.src = '/' + s.m;
    $('#song').value = id;
    document.title = s.t + ' · 歌词对齐';
    const box = document.createElement('div');
    box.className = 'lyr';
    box.innerHTML = (s.y || []).map((p, i) => `<div data-i="${i}">${esc(lyrLine(i))}</div>`).join('') ||
      '<div>（这首没有时间轴，只能用打点工具）</div>';
    document.querySelector('.lyr')?.remove();
    $('.big').after(box);
    paint();
    renderList();
  }

  function setOff(v) {
    off[cur.id] = Math.round(v * 10) / 10;
    done.add(cur.id);
    saveStore();
    paint();
    renderList();
  }

  function jump(kind) {
    if (!cur.y) return;
    const dur = au.duration || cur.d;
    const o = off[cur.id] || 0;
    let t = au.currentTime;
    if (kind === 'first') {
      t = Math.max(0, cur.y[firstVocalIdx()][0] - o - 2);
    } else if (kind === 'mid') {
      const i = Math.max(firstVocalIdx(), Math.floor(cur.y.length * 0.55));
      t = Math.min(dur * 0.8, cur.y[i][0] - o - 2);
    } else if (kind === 'last') {
      t = Math.max(0, cur.y[cur.y.length - 1][0] - o - 3);
    } else {
      t = 0;
    }
    // 元数据没好之前设 currentTime 会被丢掉，等 loadedmetadata 再跳
    if (au.readyState >= 1) au.currentTime = t;
    else au.addEventListener('loadedmetadata', () => { au.currentTime = t; }, { once: true });
    if (au.paused) au.play().catch(() => {});
    paint();
  }

  fetch('/assets/songs.json').then((r) => r.json()).then((arr) => {
    songs = arr;
    const withY = arr.filter((s) => s.y);
    const without = arr.filter((s) => !s.y);
    $('#song').innerHTML = withY.map((s) => `<option value="${esc(s.id)}">${esc(s.t)} — ${esc(s.a)}</option>`).join('')
      + (without.length ? `<optgroup label="没有时间轴（用打点工具）">${without.map((s) => `<option value="${esc(s.id)}" disabled>${esc(s.t)}</option>`).join('')}</optgroup>` : '');
    loadStore();
    songs.forEach((s) => { if (off[s.id] == null && s.o) off[s.id] = s.o; });
    if (withY[0]) loadSong(withY[0].id);
  }).catch(() => { $('#big').textContent = '要从站点根目录打开（/tools/align.html）'; });

  $('#song').onchange = (e) => loadSong(e.target.value);
  $('#next').onclick = () => {
    const list = songs.filter((s) => s.y);
    const i = list.findIndex((s) => s.id === cur.id);
    if (i >= 0 && list[i + 1]) loadSong(list[i + 1].id);
  };
  $('#prev').onclick = () => {
    const list = songs.filter((s) => s.y);
    const i = list.findIndex((s) => s.id === cur.id);
    if (i > 0) loadSong(list[i - 1].id);
  };
  $('#nextTodo').onclick = () => {
    const list = songs.filter((s) => s.y);
    const i = list.findIndex((s) => s.id === cur.id);
    for (let k = 1; k <= list.length; k++) {
      const s = list[(i + k) % list.length];
      if (off[s.id] == null) { loadSong(s.id); return; }
    }
    $('#stat').textContent = '全部对齐完了 ✓';
  };
  $('#zero').onclick = () => setOff(0);
  $('#loadSite').onclick = () => {
    let n = 0;
    songs.forEach((s) => { if (s.o) { off[s.id] = s.o; n++; } });
    saveStore();
    paint();
    renderList();
    $('#stat').textContent = '已载入站点默认偏移 ' + n + ' 条';
  };
  document.querySelectorAll('[data-d]').forEach((b) => {
    b.onclick = () => setOff((off[cur.id] || 0) + Number(b.dataset.d));
  });
  document.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => jump(b.dataset.jump);
  });
  $('#rng').oninput = (e) => setOff(Number(e.target.value));

  $('#list').onclick = (e) => {
    const a = e.target.closest('a[data-id]');
    if (!a) return;
    e.preventDefault();
    loadSong(a.dataset.id);
  };

  $('#export').onclick = () => {
    const out = {};
    songs.forEach((s) => { if (off[s.id] != null) out[s.id] = off[s.id]; });
    const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'offsets.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $('#stat').textContent = '已导出 ' + Object.keys(out).length + ' 首';
  };

  au.addEventListener('timeupdate', paint);
  au.addEventListener('loadedmetadata', paint);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const o = off[cur.id] || 0;
    switch (e.key) {
      case ' ': e.preventDefault(); au.paused ? au.play() : au.pause(); break;
      case '[': e.preventDefault(); setOff(o - 0.2); break;
      case ']': e.preventDefault(); setOff(o + 0.2); break;
      case '{': e.preventDefault(); setOff(o - 5); break;
      case '}': e.preventDefault(); setOff(o + 5); break;
      case 'ArrowLeft': e.preventDefault(); au.currentTime = Math.max(0, au.currentTime - 3); break;
      case 'ArrowRight': e.preventDefault(); au.currentTime = Math.min(au.duration || cur.d, au.currentTime + 3); break;
      case 'Enter': e.preventDefault(); $('#next').click(); break;
      default: break;
    }
  });
})();
</script>
</body>
</html>
